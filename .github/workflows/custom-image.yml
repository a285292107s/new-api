name: Build custom image (GHCR)

# 只为本 fork 的日志接口补丁产镜像：推送 feature 分支或手动触发。
# 上游的 docker-build.yml 面向 Docker Hub + 多架构 + tag 触发，这里不复用。

on:
  push:
    branches:
      - 'feature/**'
    # 只有影响镜像内容的改动才触发，文档/部署说明的提交不重复构建
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'relaykit/**'
      - 'tokenkit/**'
      - 'web/**'
      - 'plugins/**'
      - 'i18n/**'
      - 'VERSION'
      - 'Dockerfile'
      - '.github/workflows/custom-image.yml'
  workflow_dispatch:

concurrency:
  group: custom-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build & push (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Pin version string
        # 保持与上游 tag 一致，避免升级检查把 fok 版本当成"更新版本"
        run: echo "v1.0.0-rc.47" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:logdelta
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=new-api (fork: logdelta)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Record digest
        run: |
          echo "### Image digest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "${{ env.IMAGE }}:sha-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
